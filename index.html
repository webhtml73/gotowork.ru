<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Go To Work — поиск работы</title>
    <style>
        body {
            font-family: Arial, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #333;
            margin: 0;
            padding: 10px;
        }
        header {
            background-color: #dcdcdc;
            border: 1px solid #999;
            color: #000;
            padding: 15px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }
        .subtitle {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background: #fff;
            border: 1px solid #bbb;
        }
        .search-box {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ccc;
        }
        input[type="text"] {
            padding: 6px;
            border: 1px solid #999;
            background: #f9f9f9;
            width: 250px;
            font-size: 13px;
        }
        button {
            padding: 6px 12px;
            background-color: #ddd;
            color: #000;
            border: 1px solid #888;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        button:hover {
            background-color: #ccc;
        }
        /* Сетка карточек в стиле 2009 — float вместо grid */
        .vacancies-grid {
            overflow: hidden;
        }
        .card {
            float: left;
            width: 230px;
            margin: 10px 15px 10px 0;
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #222;
        }
        .salary {
            color: #006600;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            display: block;
        }
        .apply-btn {
            width: 100%;
            background-color: #eee;
            border: 1px solid #aaa;
            color: #000;
        }
        .apply-btn:hover {
            background-color: #ddd;
        }

        /* Модальное окно — простой блок поверх страницы */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: #fff;
            padding: 20px;
            border: 2px solid #999;
            width: 400px;
            box-shadow: 4px 4px 0px #000; /* характерная тень 2000-х */
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .form-group input {
            width: 98%;
            padding: 4px;
            border: 1px solid #999;
        }
        .payment-info {
            background: #ffffcc;
            border: 1px solid #ffcc00;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #b35b00;
        }
        .close-modal {
            cursor: pointer;
            float: right;
            font-weight: bold;
            color: #666;
        }
        footer {
            text-align: center;
            padding: 15px;
            color: #777;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Go To Work</h1>
        <span class="subtitle">Платформа поиска работы — вакансии по дням</span>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по профессии">
            <button onclick="filterJobs()">Найти</button>
        </div>

        <div class="vacancies-grid" id="jobsContainer">
            <!-- Вакансии будут выведены сюда через JS -->
        </div>
    </main>

    <!-- Модальное окно заявки -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 style="margin-top:0;">Откликнуться на вакансию</h2>
            <div class="payment-info">
                Оплата производится после смены. Сумма зависит от выбранной вакансии.
            </div>
            <form id="applicationForm">
                <input type="hidden" id="selectedJob">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="applicantName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="applicantPhone" required placeholder="+7 (999) 000-00-00">
                </div>
                <button type="submit" style="width:100%">Отправить заявку</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 Go To Work (All Rights Reserved)
    </footer>

    <script>
        const jobs = [
            { title: 'Грузчик', salary: 'от 1 500 ₽ за смену' },
            { title: 'Уборщица', salary: 'от 1 200 ₽ за смену' },
            { title: 'Курьер пеший', salary: 'от 1 300 ₽ за смену' },
            { title: 'Официант', salary: 'от 2 000 ₽ + чаевые' },
            { title: 'Фасовщик на склад', salary: 'от 1 700 ₽ за смену' },
            { title: 'Мойщик посуды', salary: 'от 1 400 ₽ за смену' },
            { title: 'Промоутер у метро', salary: 'от 1 100 ₽ в час' },
            { title: 'Разнорабочий на стройку', salary: 'от 2 200 ₽ за смену' }
        ];

        let selectedJobTitle = '';

        function renderJobs(list) {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '';
            list.forEach(job => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${job.title}</h3>
                    <span class="salary">${job.salary}</span>
                    <button class="apply-btn" onclick="openModal('${job.title}')">Откликнуться</button>
                `;
                container.appendChild(card);
            });
        }

        function filterJobs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = jobs.filter(job =>
                job.title.toLowerCase().includes(query)
            );
            renderJobs(filtered);
        }

        // Открытие модального окна
        function openModal(jobTitle) {
            selectedJobTitle = jobTitle;
            document.getElementById('selectedJob').value = jobTitle;
            document.getElementById('applyModal').style.display = 'flex';
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('applyModal').style.display = 'none';
        }

        // Обработка формы
        document.getElementById('applicationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('applicantName').value;
            const phone = document.getElementById('applicantPhone').value;
            const job = document.getElementById('selectedJob').value;

            alert(`Заявка принята!\n\nВакансия: ${job}\nИмя: ${name}\nТелефон: ${phone}\n\nМенеджер свяжется с вами для подтверждения смены и условий оплаты.`);
            closeModal();
            this.reset();
        });

        // Закрыть по клику вне окна
        window.onclick = function(event) {
            const modal = document.getElementById('applyModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Показать все вакансии при загрузке
        renderJobs(jobs);
    </script>
</body>
</html>
